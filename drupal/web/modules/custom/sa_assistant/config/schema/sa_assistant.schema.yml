sa_assistant.settings:
  type: config_object
  label: 'Ajustes del asistente'
  mapping:
    enabled:
      type: boolean
      label: 'Asistente activo'
    welcome:
      type: text
      label: 'Mensaje de bienvenida'
    suggestions:
      type: sequence
      label: 'Preguntas sugeridas'
      sequence:
        type: label
        label: 'Pregunta'
    rate_limit:
      type: integer
      label: 'Mensajes por hora y por IP'
    typing_delay_ms:
      type: integer
      label: 'Pausa entre trozos de texto (ms)'
